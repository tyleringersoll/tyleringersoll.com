[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Redirects and page rewrites live in public/_redirects so they are processed
# before Nitro's generated 404 fallback. /storybook/ stays a static directory.

[[edge_functions]]
  path = "/*"
  function = "inject-geo"
