name: Component workshop

on:
  push:
    branches: [main]
  pull_request:

jobs:
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run generate
      - name: Run stories and accessibility checks at the deployed subpath
        run: |
          python3 -m http.server 6006 --directory .output/public > /tmp/storybook-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6006/storybook/index.json > /dev/null; then break; fi
            sleep 1
          done
          npm run test:storybook -- --url http://127.0.0.1:6006/storybook --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-workshop
          path: .storybook-static
          retention-days: 7
